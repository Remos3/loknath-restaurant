<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokenath Admin | Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 select-none">

  <!-- PIN Login Overlay -->
  <div id="loginOverlay" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-base font-bold text-gray-900">Admin Login</h2>
      <p class="text-xs text-gray-500 mb-4">Enter 4-digit secret PIN</p>
      
      <input type="password" id="adminPin" maxlength="4" placeholder="••••" class="w-full text-center tracking-widest text-xl font-bold border rounded-xl py-2 mb-3 outline-none focus:ring-2 focus:ring-amber-500">
      
      <button onclick="verifyPin()" class="w-full bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md">
        Unlock Dashboard
      </button>
      <p id="pinError" class="text-xs text-red-500 mt-2 hidden">Galat PIN hai! Wapas try karein.</p>
    </div>
  </div>

  <!-- Admin Main Dashboard -->
  <div id="adminApp" class="hidden">
    
    <!-- Top Header -->
    <header class="bg-gray-900 text-white p-4 sticky top-0 z-30 shadow flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold">Lokenath Restaurant Dashboard</h1>
        <p id="liveStatus" class="text-[11px] text-green-400 flex items-center gap-1 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-ping"></span> Live Realtime Active
        </p>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <span class="text-[10px] text-gray-400 block uppercase">Sales</span>
          <span class="text-sm font-black text-amber-400">₹<span id="todaySales">0</span></span>
        </div>
        <button onclick="logoutAdmin()" title="Logout" class="text-gray-400 hover:text-white text-xs bg-gray-800 p-2 rounded-lg">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b sticky top-[65px] z-20 flex px-4">
      <button id="tabOrdersBtn" onclick="switchTab('orders')" class="flex-1 py-3 text-center text-xs font-bold border-b-2 border-red-600 text-red-600 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-receipt"></i> Live Orders
      </button>
      <button id="tabStockBtn" onclick="switchTab('stock')" class="flex-1 py-3 text-center text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-boxes-stacked"></i> Stock / Sold Out
      </button>
    </div>

    <!-- TAB 1: Live Orders View -->
    <main id="ordersView" class="max-w-xl mx-auto p-4 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Incoming Orders Queue</h2>
        <button onclick="fetchOrders()" class="text-xs font-semibold text-blue-600 hover:underline flex items-center gap-1">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh
        </button>
      </div>

      <div id="ordersContainer" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-8">Loading orders...</p>
      </div>
    </main>

    <!-- TAB 2: Stock Management View -->
    <main id="stockView" class="max-w-xl mx-auto p-4 space-y-3 hidden">
      <div class="flex justify-between items-center mb-1">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Item Stock Status</h2>
        <span class="text-[11px] text-gray-400">Toggle to turn On/Off</span>
      </div>

      <div id="stockListContainer" class="space-y-2">
        <p class="text-center text-xs text-gray-400 py-8">Loading items...</p>
      </div>
    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://amsshjptvzzoskcjqqbe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_sJ_BAPbnHi_zyEiOr6YA0g_BHE_weNx";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SECRET_PIN = "1234";

    function verifyPin() {
      const pin = document.getElementById('adminPin').value;
      if (pin === SECRET_PIN) {
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        showDashboard();
      } else {
        document.getElementById('pinError').classList.remove('hidden');
      }
    }

    function showDashboard() {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('adminApp').classList.remove('hidden');
      fetchOrders();
      fetchStockItems();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('isAdminLoggedIn');
      location.reload();
    }

    if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
      showDashboard();
    }

    function switchTab(tab) {
      const ordersView = document.getElementById('ordersView');
      const stockView = document.getElementById('stockView');
      const tabOrdersBtn = document.getElementById('tabOrdersBtn');
      const tabStockBtn = document.getElementById('tabStockBtn');

      if (tab === 'orders') {
        ordersView.classList.remove('hidden');
        stockView.classList.add('hidden');
        tabOrdersBtn.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-red-600 text-red-600 flex items-center justify-center gap-1.5";
        tabStockBtn.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-transparent text-gray-500 flex items-center justify-center gap-1.5";
      } else {
        ordersView.classList.add('hidden');
        stockView.classList.remove('hidden');
        tabStockBtn.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-red-600 text-red-600 flex items-center justify-center gap-1.5";
        tabOrdersBtn.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-transparent text-gray-500 flex items-center justify-center gap-1.5";
        fetchStockItems();
      }
    }

    function playAlertSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    async function fetchOrders() {
      const { data, error } = await db.from('orders')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(40);

      if (!error) renderOrders(data);
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';

      let totalSales = 0;
      orders.forEach(o => {
        if (o.status !== 'cancelled') totalSales += Number(o.total_amount);
      });
      document.getElementById('todaySales').textContent = totalSales;

      if (!orders || orders.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Abhi koi order nahi hai.</p>`;
        return;
      }

      orders.forEach(order => {
        const card = document.createElement('div');
        const isPending = order.status === 'pending';
        card.className = `p-4 rounded-2xl border bg-white shadow-sm transition ${isPending ? 'border-red-400 ring-2 ring-red-100' : 'border-gray-200'}`;

        const items = Array.isArray(order.items) ? order.items : [];
        const itemsHtml = items.map(i => 
          `<li class="flex justify-between text-xs py-1 border-b border-gray-100 last:border-none">
            <span>${i.name} ${i.variant && i.variant !== 'Regular' ? '(' + i.variant + ')' : ''} &times; ${i.qty}</span>
            <span class="font-semibold text-gray-900">₹${i.qty * i.price}</span>
          </li>`
        ).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-2 mb-2">
            <div>
              <span class="text-sm font-black text-gray-900">Order #${order.order_number}</span>
              <span class="text-[11px] text-gray-400 ml-2">${new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
            <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded-full ${getStatusBadge(order.status)}">${order.status}</span>
          </div>

          <div class="text-xs space-y-1 mb-3">
            <p><i class="fa-solid fa-user text-gray-400 w-4"></i> <strong class="text-gray-800">${order.customer_name}</strong></p>
            <p><i class="fa-solid fa-phone text-gray-400 w-4"></i> <a href="tel:${order.customer_phone}" class="text-blue-600 font-semibold underline">${order.customer_phone}</a></p>
            <p><i class="fa-solid fa-location-dot text-gray-400 w-4"></i> ${order.delivery_address}</p>
          </div>

          <ul class="border rounded-xl py-1 px-3 mb-3 bg-gray-50/70">${itemsHtml}</ul>

          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-semibold text-gray-500">Bill Total:</span>
            <span class="text-base font-black text-red-600">₹${order.total_amount}</span>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <button onclick="updateStatus('${order.id}', 'accepted')" class="bg-blue-50 active:bg-blue-100 text-blue-700 py-1.5 rounded-lg text-xs font-bold transition">Accept</button>
            <button onclick="updateStatus('${order.id}', 'out_for_delivery')" class="bg-amber-50 active:bg-amber-100 text-amber-700 py-1.5 rounded-lg text-xs font-bold transition">Dispatch</button>
            <button onclick="updateStatus('${order.id}', 'delivered')" class="bg-green-50 active:bg-green-100 text-green-700 py-1.5 rounded-lg text-xs font-bold transition">Delivered</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function getStatusBadge(status) {
      switch(status) {
        case 'pending': return 'bg-red-100 text-red-700';
        case 'accepted': return 'bg-blue-100 text-blue-700';
        case 'out_for_delivery': return 'bg-amber-100 text-amber-700';
        case 'delivered': return 'bg-green-100 text-green-700';
        default: return 'bg-gray-100 text-gray-700';
      }
    }

    async function updateStatus(id, newStatus) {
      await db.from('orders').update({ status: newStatus }).eq('id', id);
      fetchOrders();
    }

    async function fetchStockItems() {
      const { data, error } = await db.from('menu_items')
        .select('*')
        .order('name', { ascending: true });

      if (error) return;

      const container = document.getElementById('stockListContainer');
      container.innerHTML = '';

      data.forEach(item => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center bg-white p-3 rounded-xl border border-gray-200 shadow-sm";
        row.innerHTML = `
          <div>
            <h4 class="text-xs font-bold text-gray-900">${item.name}</h4>
            <span class="text-[10px] font-semibold ${item.is_available ? 'text-green-600' : 'text-red-500'}">
              ${item.is_available ? 'In Stock (Available)' : 'SOLD OUT (Unavailable)'}
            </span>
          </div>
          <button onclick="toggleItemStock('${item.id}', ${!item.is_available})" 
            class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${item.is_available ? 'bg-red-50 text-red-600 border border-red-200 active:bg-red-100' : 'bg-green-50 text-green-700 border border-green-200 active:bg-green-100'}">
            ${item.is_available ? 'Mark Out of Stock' : 'Mark Available'}
          </button>
        `;
        container.appendChild(row);
      });
    }

    async function toggleItemStock(id, newStatus) {
      await db.from('menu_items').update({ is_available: newStatus }).eq('id', id);
      fetchStockItems();
    }

    db.channel('orders-realtime')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
        playAlertSound();
        fetchOrders();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, () => {
        fetchOrders();
      })
      .subscribe();
  </script>
</body>
</html>
