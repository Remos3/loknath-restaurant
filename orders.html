<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Orders & Bookings | Lokenath Restaurant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 pb-16 select-none">

  <!-- Header -->
  <header class="bg-white border-b px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-xs">
    <a href="index.html" class="text-gray-500 hover:text-gray-900 text-xs font-bold flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left"></i> Home Menu
    </a>
    <h1 class="text-xs font-black text-gray-900 uppercase tracking-wider">Tracking & History</h1>
  </header>

  <!-- Dual Tabs: Food Orders & Table Bookings -->
  <div class="bg-white border-b flex px-4">
    <button id="tabFoodBtn" onclick="switchView('food')" class="flex-1 py-3 text-center text-xs font-bold border-b-2 border-red-600 text-red-600">
      <i class="fa-solid fa-burger mr-1"></i> Food Orders
    </button>
    <button id="tabTableBtn" onclick="switchView('table')" class="flex-1 py-3 text-center text-xs font-bold border-b-2 border-transparent text-gray-500">
      <i class="fa-solid fa-chair mr-1"></i> Table Bookings
    </button>
  </div>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Live Food Order Tracker (Shown if ?track=id in URL) -->
    <div id="liveTrackerContainer" class="hidden space-y-3"></div>

    <!-- Food Orders View -->
    <section id="foodOrdersView" class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-black text-gray-500 uppercase tracking-wider">Recent Food Orders</h2>
        <button onclick="fetchCustomerOrders()" class="text-xs font-bold text-red-600 hover:underline">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
      <div id="ordersListContainer" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-8">Loading food orders...</p>
      </div>
    </section>

    <!-- Table Bookings View -->
    <section id="tableBookingsView" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-black text-gray-500 uppercase tracking-wider">Your Table Reservations</h2>
        <button onclick="fetchTableBookings()" class="text-xs font-bold text-amber-600 hover:underline">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
      <div id="tableListContainer" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-8">Loading table bookings...</p>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://amsshjptvzzoskcjqqbe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_sJ_BAPbnHi_zyEiOr6YA0g_BHE_weNx";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentTab = 'food';

    const STAGES = [
      { key: 'placed', label: 'Order Placed', desc: 'Received at counter', icon: 'fa-receipt' },
      { key: 'accepted', label: 'Accepted', desc: 'Kitchen confirmed ticket', icon: 'fa-kitchen-set' },
      { key: 'preparing', label: 'Preparing Food', desc: 'Cooking fresh ingredients', icon: 'fa-fire-burner' },
      { key: 'ready', label: 'Ready for Pickup', desc: 'Packed & waiting for rider', icon: 'fa-box' },
      { key: 'out_for_delivery', label: 'Out for Delivery', desc: 'Rider is on the way', icon: 'fa-motorcycle' },
      { key: 'delivered', label: 'Delivered', desc: 'Enjoy your hot meal!', icon: 'fa-house-circle-check' }
    ];

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const trackId = urlParams.get('track');
      const viewParam = urlParams.get('view');

      if (viewParam === 'table') {
        switchView('table');
      } else {
        if (trackId) {
          await loadSingleTracker(trackId);
          subscribeToOrder(trackId);
        }
        await fetchCustomerOrders();
      }
    }

    function switchView(tab) {
      currentTab = tab;
      const tabF = document.getElementById('tabFoodBtn');
      const tabT = document.getElementById('tabTableBtn');
      const viewF = document.getElementById('foodOrdersView');
      const viewT = document.getElementById('tableBookingsView');

      if (tab === 'food') {
        tabF.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-red-600 text-red-600";
        tabT.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-transparent text-gray-500";
        viewF.classList.remove('hidden');
        viewT.classList.add('hidden');
        fetchCustomerOrders();
      } else {
        tabT.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-amber-600 text-amber-600";
        tabF.className = "flex-1 py-3 text-center text-xs font-bold border-b-2 border-transparent text-gray-500";
        viewT.classList.remove('hidden');
        viewF.classList.add('hidden');
        fetchTableBookings();
      }
    }

    // --- FOOD ORDERS LOGIC ---
    async function fetchCustomerOrders() {
      const { data: { session } } = await db.auth.getSession();
      const container = document.getElementById('ordersListContainer');

      let query = db.from('orders').select('*').order('created_at', { ascending: false }).limit(20);
      if (session?.user) {
        query = query.eq('user_id', session.user.id);
      }

      const { data: orders } = await query;

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-white rounded-3xl border text-gray-400 text-xs">
            ${session?.user ? 'Aapka koi purana food order nahi mila.' : 'Sign in to see past orders automatically.'}
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      orders.forEach(o => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-xs space-y-2";
        const items = Array.isArray(o.items) ? o.items.map(i => `${i.name} (${i.qty})`).join(', ') : '';

        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-2">
            <div>
              <span class="font-black text-gray-950 text-sm">Ticket #${o.order_number}</span>
              <p class="text-[10px] text-gray-400">${new Date(o.created_at).toLocaleDateString()} at ${new Date(o.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
            </div>
            <span class="font-black text-red-600 text-sm">₹${o.total_amount}</span>
          </div>
          <p class="text-gray-600 line-clamp-1">${items}</p>
          <div class="flex justify-between items-center pt-1">
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${getStatusBadge(o.status)}">${o.status}</span>
            <button onclick="loadSingleTracker('${o.id}'); window.scrollTo({top:0, behavior:'smooth'});" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3 py-1.5 rounded-xl border border-red-200">
              Track Live
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- TABLE BOOKINGS LOGIC ---
    async function fetchTableBookings() {
      const { data: { session } } = await db.auth.getSession();
      const container = document.getElementById('tableListContainer');

      let query = db.from('table_bookings').select('*').order('created_at', { ascending: false }).limit(20);
      if (session?.user) {
        query = query.or(`user_id.eq.${session.user.id},customer_phone.eq.${session.user.user_metadata?.phone || ''}`);
      }

      const { data: bookings } = await query;

      if (!bookings || bookings.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-white rounded-3xl border text-gray-400 text-xs">
            Aapki koi table reservation nahi mili.
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      bookings.forEach(b => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-xs space-y-2.5";
        
        let statusColor = "bg-amber-100 text-amber-800";
        if (b.status === 'confirmed') statusColor = "bg-emerald-100 text-emerald-800 font-black";
        if (b.status === 'cancelled') statusColor = "bg-rose-100 text-rose-700";

        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-2">
            <div class="flex items-center gap-2">
              <span class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                <i class="fa-solid fa-chair text-sm"></i>
              </span>
              <div>
                <span class="font-black text-gray-950 text-sm">Table for ${b.guest_count} Person(s)</span>
                <p class="text-[10px] text-gray-400">Reserved for: ${b.customer_name}</p>
              </div>
            </div>
            <span class="text-[10px] uppercase font-black px-2.5 py-0.5 rounded-full ${statusColor}">${b.status}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-gray-600 text-[11px] bg-gray-50 p-2.5 rounded-xl">
            <div><i class="fa-regular fa-calendar text-amber-600 mr-1"></i> <strong>Date:</strong> ${b.booking_date}</div>
            <div><i class="fa-regular fa-clock text-amber-600 mr-1"></i> <strong>Time:</strong> ${b.booking_time}</div>
          </div>

          ${b.special_request ? `<p class="text-[11px] text-gray-500 italic"><i class="fa-solid fa-comment-dots text-gray-400 mr-1"></i> "${b.special_request}"</p>` : ''}
          
          <div class="pt-1 flex justify-between items-center text-[10px] text-gray-400">
            <span>Booked: ${new Date(b.created_at).toLocaleDateString()}</span>
            <a href="tel:9387078054" class="text-amber-700 font-bold hover:underline">Counter Help</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function getStatusBadge(s) {
      if (s === 'delivered') return 'bg-emerald-100 text-emerald-800';
      if (s === 'cancelled') return 'bg-rose-100 text-rose-700';
      return 'bg-amber-100 text-amber-800';
    }

    async function loadSingleTracker(orderId) {
      const { data: order } = await db.from('orders').select('*').eq('id', orderId).single();
      const container = document.getElementById('liveTrackerContainer');
      if (!order) return;

      container.classList.remove('hidden');
      const isCancelled = order.status === 'cancelled';
      const stageIdx = STAGES.findIndex(s => s.key === order.status);

      let stepsHtml = '';
      STAGES.forEach((s, i) => {
        const passed = stageIdx >= i;
        const current = stageIdx === i;
        stepsHtml += `
          <div class="relative flex items-start gap-3">
            <span class="absolute -left-6 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${passed ? 'bg-red-600 text-white ring-4 ring-red-100' : 'bg-gray-200 text-gray-500'}">
              <i class="fa-solid ${passed ? 'fa-check' : s.icon}"></i>
            </span>
            <div class="min-w-0">
              <h4 class="text-xs font-bold leading-tight ${current ? 'text-red-600 font-black' : passed ? 'text-gray-900' : 'text-gray-400'}">${s.label}</h4>
              <p class="text-[10px] text-gray-400">${s.desc}</p>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="bg-gradient-to-r from-red-600 to-amber-600 text-white p-4 rounded-3xl shadow-sm">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] uppercase font-bold text-amber-100">Live Order Status</span>
              <h3 class="text-xl font-black mt-0.5">Ticket #${order.order_number}</h3>
              <p class="text-xs text-amber-100 mt-0.5">${isCancelled ? 'Order was Cancelled' : (order.estimated_time || 'ETA: 25-35 mins')}</p>
            </div>
            <span class="text-[10px] font-black uppercase bg-white/20 px-2 py-0.5 rounded-full">${order.status}</span>
          </div>
        </div>

        ${!isCancelled ? `
          <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
            <div class="relative pl-6 space-y-5 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-gray-100">
              ${stepsHtml}
            </div>
          </div>
        ` : `
          <div class="p-3 bg-rose-50 text-rose-700 text-xs rounded-2xl border border-rose-200">
            This order ticket was cancelled. Please call counter for details.
          </div>
        `}
      `;
    }

    function subscribeToOrder(id) {
      db.channel('customer-live-order')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${id}` }, () => {
          loadSingleTracker(id);
          fetchCustomerOrders();
        })
        .subscribe();
    }

    init();
  </script>
</body>
</html>
