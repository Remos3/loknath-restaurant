<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Orders & Live Tracking | Lokenath Restaurant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 pb-16 select-none">

  <!-- Header -->
  <header class="bg-white border-b px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-xs">
    <a href="index.html" class="text-gray-500 hover:text-gray-900 text-xs font-bold flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left"></i> Home Menu
    </a>
    <h1 class="text-xs font-black text-gray-900 uppercase tracking-wider">Order Tracking & History</h1>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Active Order Tracker View (Shown if ?track=id in URL) -->
    <div id="liveTrackerContainer" class="hidden space-y-3"></div>

    <!-- History Tab Headers -->
    <div class="flex items-center justify-between pt-2 border-b pb-2">
      <h2 class="text-xs font-black text-gray-500 uppercase tracking-wider">Your Recent Orders</h2>
      <button onclick="fetchCustomerOrders()" class="text-xs font-bold text-red-600 hover:underline">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
    </div>

    <!-- Orders List -->
    <div id="ordersListContainer" class="space-y-3">
      <p class="text-center text-xs text-gray-400 py-10">Loading your orders...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://amsshjptvzzoskcjqqbe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_sJ_BAPbnHi_zyEiOr6YA0g_BHE_weNx";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STAGES = [
      { key: 'placed', label: 'Order Placed', desc: 'Received at counter', icon: 'fa-receipt' },
      { key: 'accepted', label: 'Accepted', desc: 'Kitchen confirmed ticket', icon: 'fa-kitchen-set' },
      { key: 'preparing', label: 'Preparing Food', desc: 'Cooking fresh ingredients', icon: 'fa-fire-burner' },
      { key: 'ready', label: 'Ready for Pickup', desc: 'Packed & waiting for rider', icon: 'fa-box' },
      { key: 'out_for_delivery', label: 'Out for Delivery', desc: 'Rider is on the way', icon: 'fa-motorcycle' },
      { key: 'delivered', label: 'Delivered', desc: 'Enjoy your hot meal!', icon: 'fa-house-circle-check' }
    ];

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const trackId = urlParams.get('track');

      if (trackId) {
        await loadSingleTracker(trackId);
        subscribeToOrder(trackId);
      }
      await fetchCustomerOrders();
    }

    async function loadSingleTracker(orderId) {
      const { data: order } = await db.from('orders').select('*').eq('id', orderId).single();
      const container = document.getElementById('liveTrackerContainer');
      if (!order) return;

      container.classList.remove('hidden');
      const isCancelled = order.status === 'cancelled';
      const stageIdx = STAGES.findIndex(s => s.key === order.status);

      let stepsHtml = '';
      STAGES.forEach((s, i) => {
        const passed = stageIdx >= i;
        const current = stageIdx === i;
        stepsHtml += `
          <div class="relative flex items-start gap-3">
            <span class="absolute -left-6 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${passed ? 'bg-red-600 text-white ring-4 ring-red-100' : 'bg-gray-200 text-gray-500'}">
              <i class="fa-solid ${passed ? 'fa-check' : s.icon}"></i>
            </span>
            <div class="min-w-0">
              <h4 class="text-xs font-bold leading-tight ${current ? 'text-red-600 font-black' : passed ? 'text-gray-900' : 'text-gray-400'}">${s.label}</h4>
              <p class="text-[10px] text-gray-400">${s.desc}</p>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="bg-gradient-to-r from-red-600 to-amber-600 text-white p-4 rounded-3xl shadow-sm">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] uppercase font-bold text-amber-100">Live Order Status</span>
              <h3 class="text-xl font-black mt-0.5">Ticket #${order.order_number}</h3>
              <p class="text-xs text-amber-100 mt-0.5">${isCancelled ? 'Order was Cancelled' : (order.estimated_time || 'ETA: 25-35 mins')}</p>
            </div>
            <span class="text-[10px] font-black uppercase bg-white/20 px-2 py-0.5 rounded-full">${order.status}</span>
          </div>
        </div>

        ${!isCancelled ? `
          <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
            <div class="relative pl-6 space-y-5 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-gray-100">
              ${stepsHtml}
            </div>
          </div>
        ` : `
          <div class="p-3 bg-rose-50 text-rose-700 text-xs rounded-2xl border border-rose-200">
            This order ticket was cancelled. Please call counter for details.
          </div>
        `}

        ${order.rider_name ? `
          <div class="bg-white p-3.5 rounded-2xl border flex items-center justify-between text-xs">
            <div class="flex items-center gap-2.5">
              <i class="fa-solid fa-person-biking text-amber-600 text-lg"></i>
              <div>
                <strong class="text-gray-900 block">${order.rider_name}</strong>
                <span class="text-[10px] text-gray-400">Assigned Delivery Partner</span>
              </div>
            </div>
            ${order.rider_phone ? `<a href="tel:${order.rider_phone}" class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-xl font-bold border border-emerald-200"><i class="fa-solid fa-phone"></i> Call</a>` : ''}
          </div>
        ` : ''}
      `;
    }

    async function fetchCustomerOrders() {
      const { data: { session } } = await db.auth.getSession();
      const container = document.getElementById('ordersListContainer');

      let query = db.from('orders').select('*').order('created_at', { ascending: false }).limit(20);
      if (session?.user) {
        query = query.eq('user_id', session.user.id);
      }

      const { data: orders } = await query;

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-white rounded-3xl border text-gray-400 text-xs">
            ${session?.user ? 'Aapka koi purana order record nahi mila.' : 'Sign in to see your past orders automatically, or track with your WhatsApp order link.'}
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      orders.forEach(o => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-xs space-y-2";
        const items = Array.isArray(o.items) ? o.items.map(i => `${i.name} (${i.qty})`).join(', ') : '';

        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-2">
            <div>
              <span class="font-black text-gray-950 text-sm">Ticket #${o.order_number}</span>
              <p class="text-[10px] text-gray-400">${new Date(o.created_at).toLocaleDateString()} at ${new Date(o.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
            </div>
            <span class="font-black text-red-600 text-sm">₹${o.total_amount}</span>
          </div>
          <p class="text-gray-600 line-clamp-1">${items}</p>
          <div class="flex justify-between items-center pt-1">
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${getStatusBadge(o.status)}">${o.status}</span>
            <button onclick="loadSingleTracker('${o.id}'); window.scrollTo({top:0, behavior:'smooth'});" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3 py-1.5 rounded-xl border border-red-200">
              Track Live
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function getStatusBadge(s) {
      if (s === 'delivered') return 'bg-emerald-100 text-emerald-800';
      if (s === 'cancelled') return 'bg-rose-100 text-rose-700';
      return 'bg-amber-100 text-amber-800';
    }

    function subscribeToOrder(id) {
      db.channel('customer-live-order')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${id}` }, () => {
          loadSingleTracker(id);
          fetchCustomerOrders();
        })
        .subscribe();
    }

    init();
  </script>
</body>
</html>
