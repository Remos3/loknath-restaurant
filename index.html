<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lokenath Restaurant & Hotel | Order Online</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28 select-none">

  <!-- Header -->
  <header class="bg-gradient-to-r from-red-600 to-amber-600 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight">Lokenath Restaurant & Hotel</h1>
        <p class="text-xs text-amber-100 flex items-center gap-1 mt-0.5">
          <i class="fa-solid fa-location-dot"></i> Kadamtala to Block Rd, RK Nagar
        </p>
      </div>
      <a href="tel:9387078054" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1 border border-white/30 backdrop-blur-sm">
        <i class="fa-solid fa-phone"></i> Call
      </a>
    </div>
    
    <div class="mt-3 flex items-center justify-between bg-black/20 px-3 py-1.5 rounded-lg text-xs">
      <span class="flex items-center gap-1"><i class="fa-regular fa-clock"></i> 9:00 AM - 8:00 PM</span>
      <span class="bg-green-500 text-white font-bold px-2 py-0.5 rounded text-[10px]">DELIVERY OPEN</span>
    </div>
  </header>

  <!-- Categories Scrollbar -->
  <nav id="categoryNav" class="bg-white border-b sticky top-[98px] z-20 py-2.5 px-3 flex gap-2 overflow-x-auto no-scrollbar shadow-sm">
    <button onclick="filterCategory('All')" class="cat-btn active bg-red-600 text-white px-3.5 py-1 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">All</button>
  </nav>

  <!-- Menu List -->
  <main class="p-3 max-w-lg mx-auto space-y-3" id="menuContainer">
    <div class="text-center py-12 text-gray-400">
      <i class="fa-solid fa-utensils text-3xl animate-bounce mb-2"></i>
      <p class="text-sm font-semibold">Loading Menu...</p>
    </div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div id="cartBar" class="fixed bottom-0 left-0 right-0 p-3 bg-white border-t z-30 hidden shadow-[0_-4px_16px_rgba(0,0,0,0.1)]">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500"><span id="cartCount" class="font-bold text-gray-800">0</span> ITEMS</p>
        <p class="text-lg font-black text-gray-900">₹<span id="cartTotal">0</span></p>
      </div>
      <button onclick="openCheckoutModal()" class="bg-red-600 active:bg-red-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-md flex items-center gap-2">
        View Cart <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-gray-900">Checkout & Order</h3>
        <button onclick="closeCheckoutModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 text-sm flex-1">
        <div>
          <h4 class="font-semibold text-xs text-gray-500 uppercase tracking-wider mb-2">Order Summary</h4>
          <div id="checkoutItems" class="space-y-2 border-b pb-3"></div>
          <div class="flex justify-between items-center pt-2 font-bold text-base">
            <span>To Pay:</span>
            <span class="text-red-600">₹<span id="modalTotal">0</span></span>
          </div>
        </div>

        <form id="orderForm" onsubmit="handlePlaceOrder(event)" class="space-y-3 pt-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Your Name *</label>
            <input type="text" id="custName" required placeholder="Full Name" class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp Mobile *</label>
            <input type="tel" id="custPhone" pattern="[0-9]{10}" required placeholder="10-digit number" class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Delivery Address * (Kadamtala to Block Rd)</label>
            <textarea id="custAddress" required rows="2" placeholder="House no, Landmark, Area" class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 outline-none"></textarea>
          </div>

          <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
            <i class="fa-solid fa-truck"></i> Cash on Delivery / UPI on Delivery
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 active:scale-[0.99] text-white py-3 rounded-xl font-bold text-sm shadow-md flex items-center justify-center gap-2">
            <i class="fa-brands fa-whatsapp text-lg"></i> Place Order via WhatsApp
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://amsshjptvzzoskcjqqbe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_sJ_BAPbnHi_zyEiOr6YA0g_BHE_weNx";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMenuItems = [];
    let cart = {};
    let activeCategory = 'All';

    async function init() {
      await fetchCategories();
      await fetchMenuItems();
    }

    async function fetchCategories() {
      const { data, error } = await db.from('categories').select('*').order('sort_order', { ascending: true });
      if (data && data.length > 0) {
        const nav = document.getElementById('categoryNav');
        nav.innerHTML = '<button onclick="filterCategory(\'All\')" class="cat-btn active bg-red-600 text-white px-3.5 py-1 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">All</button>';
        data.forEach(c => {
          const btn = document.createElement('button');
          btn.className = "cat-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-3.5 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors";
          btn.textContent = c.name;
          btn.onclick = () => filterCategory(c.name);
          nav.appendChild(btn);
        });
      }
    }

    async function fetchMenuItems() {
      const { data: menuData, error: menuErr } = await db.from('menu_items')
        .select('*')
        .eq('is_available', true);

      if (menuErr) {
        document.getElementById('menuContainer').innerHTML = `<p class="text-center text-red-500 text-xs py-8">Failed to load: ${menuErr.message}</p>`;
        return;
      }

      const { data: catData } = await db.from('categories').select('*');
      const catMap = {};
      if (catData) {
        catData.forEach(c => catMap[c.id] = c.name);
      }

      allMenuItems = (menuData || []).map(item => ({
        ...item,
        category_name: catMap[item.category_id] || ''
      }));

      renderMenu(allMenuItems);
    }

    function renderMenu(items) {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-10 text-xs">No items available right now.</p>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between gap-3";

        const vegIcon = item.is_veg
          ? `<span class="inline-flex items-center justify-center w-3.5 h-3.5 border border-green-600 rounded-sm p-[1px]"><span class="w-1.5 h-1.5 bg-green-600 rounded-full"></span></span>`
          : `<span class="inline-flex items-center justify-center w-3.5 h-3.5 border border-red-600 rounded-sm p-[1px]"><span class="w-1.5 h-1.5 bg-red-600 rounded-full"></span></span>`;

        let actionUI = '';

        if (item.has_variants) {
          actionUI = `
            <div class="flex flex-col gap-1.5 items-end">
              <div class="flex items-center gap-1">
                <span class="text-[11px] text-gray-500 font-semibold">Half ₹${item.price_half}</span>
                ${getCartButton(item, 'Half', item.price_half)}
              </div>
              <div class="flex items-center gap-1">
                <span class="text-[11px] text-gray-500 font-semibold">Full ₹${item.price_full}</span>
                ${getCartButton(item, 'Full', item.price_full)}
              </div>
            </div>
          `;
        } else {
          actionUI = `
            <div class="flex flex-col items-end">
              <span class="text-sm font-black text-gray-900 mb-1">₹${item.price_single}</span>
              ${getCartButton(item, 'Regular', item.price_single)}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-1.5 mb-0.5">
              ${vegIcon}
              <span class="text-[11px] text-amber-700 font-semibold uppercase tracking-wide">${item.category_name}</span>
            </div>
            <h3 class="font-bold text-sm text-gray-800 leading-snug">${item.name}</h3>
          </div>
          <div>${actionUI}</div>
        `;
        container.appendChild(card);
      });
    }

    function getCartButton(item, variant, price) {
      const key = `${item.id}_${variant}`;
      const qty = cart[key] ? cart[key].qty : 0;

      if (qty > 0) {
        return `
          <div class="inline-flex items-center bg-red-50 border border-red-200 rounded-lg overflow-hidden">
            <button onclick="updateQty('${key}', -1)" class="w-6 h-6 text-red-600 font-bold active:bg-red-100 flex items-center justify-center">-</button>
            <span class="w-6 text-center text-xs font-bold text-red-700">${qty}</span>
            <button onclick="updateQty('${key}', 1)" class="w-6 h-6 text-red-600 font-bold active:bg-red-100 flex items-center justify-center">+</button>
          </div>
        `;
      }
      return `
        <button onclick="addToCart('${item.id}', '${encodeURIComponent(item.name)}', '${variant}', ${price})" 
          class="bg-white text-red-600 border border-red-500 active:bg-red-600 active:text-white px-3 py-1 rounded-lg text-xs font-bold uppercase shadow-sm transition">
          ADD
        </button>
      `;
    }

    function addToCart(id, rawName, variant, price) {
      const name = decodeURIComponent(rawName);
      const key = `${id}_${variant}`;
      cart[key] = { id, name, variant, price, qty: 1 };
      updateCartUI();
    }

    function updateQty(key, delta) {
      if (cart[key]) {
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
      }
      updateCartUI();
    }

    function updateCartUI() {
      let count = 0;
      let total = 0;
      for (const k in cart) {
        count += cart[k].qty;
        total += (cart[k].qty * cart[k].price);
      }

      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = total;
      document.getElementById('modalTotal').textContent = total;

      const bar = document.getElementById('cartBar');
      if (count > 0) {
        bar.classList.remove('hidden');
      } else {
        bar.classList.add('hidden');
        closeCheckoutModal();
      }

      renderMenu(currentFilteredItems());
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.textContent === cat) {
          btn.className = "cat-btn active bg-red-600 text-white px-3.5 py-1 rounded-full text-xs font-medium whitespace-nowrap shadow-sm";
        } else {
          btn.className = "cat-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-3.5 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors";
        }
      });
      renderMenu(currentFilteredItems());
    }

    function currentFilteredItems() {
      if (activeCategory === 'All') return allMenuItems;
      return allMenuItems.filter(i => i.category_name === activeCategory);
    }

    function openCheckoutModal() {
      const container = document.getElementById('checkoutItems');
      container.innerHTML = '';
      for (const k in cart) {
        const item = cart[k];
        const line = document.createElement('div');
        line.className = "flex justify-between items-center text-xs";
        line.innerHTML = `
          <span>${item.name} ${item.variant !== 'Regular' ? '(' + item.variant + ')' : ''} &times; ${item.qty}</span>
          <span class="font-semibold">₹${item.qty * item.price}</span>
        `;
        container.appendChild(line);
      }
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    async function handlePlaceOrder(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      const itemsArray = Object.values(cart);
      let totalAmount = 0;
      itemsArray.forEach(i => totalAmount += (i.qty * i.price));

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Processing...`;

      const { data, error } = await db.from('orders').insert([{
        customer_name: name,
        customer_phone: phone,
        delivery_address: address,
        items: itemsArray,
        total_amount: totalAmount,
        status: 'pending'
      }]).select();

      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="fa-brands fa-whatsapp text-lg"></i> Place Order via WhatsApp`;

      if (error) {
        alert("Order error: " + error.message);
        return;
      }

      const orderNumber = data[0]?.order_number || 'NEW';

      let waText = `*🔔 NEW ORDER (#${orderNumber})*\n`;
      waText += `*Restaurant:* Lokenath Restaurant & Hotel\n`;
      waText += `--------------------------\n`;
      waText += `*Name:* ${name}\n`;
      waText += `*Phone:* ${phone}\n`;
      waText += `*Address:* ${address}\n`;
      waText += `--------------------------\n*Items:*\n`;
      itemsArray.forEach(i => {
        waText += `• ${i.name} ${i.variant !== 'Regular' ? '(' + i.variant + ')' : ''} x ${i.qty} = ₹${i.qty * i.price}\n`;
      });
      waText += `--------------------------\n`;
      waText += `*Total Amount:* ₹${totalAmount}\n`;
      waText += `*Payment:* Cash on Delivery\n`;

      const encodedUrl = `https://wa.me/919387078054?text=${encodeURIComponent(waText)}`;

      cart = {};
      updateCartUI();
      closeCheckoutModal();
      window.location.href = encodedUrl;
    }

    // Start App
    init();
  </script>
</body>
</html>
